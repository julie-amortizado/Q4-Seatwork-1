<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>

    body{
      margin:0px;
      font-family:Poppins;
      background-image: url(https://i.pinimg.com/736x/15/b2/07/15b207ce8a8e9a50333a522f9cbfdaa3.jpg);
      background-size: cover;
      background-repeat: no-repeat;
    }

    .box{
      width:450px;
      height:400px;
      background:#5c5859;
      padding:20px;
      border-radius:25px;
      text-align:center;
      color:white;
      margin-top:200px;
      margin-left:auto;
      margin-right:auto;
    }

    h1{
      margin-bottom:20px;
    }

    input[type="text"], input[type="password"]{
      width:280px;
      height:45px;
      margin-top:10px;
      margin-bottom:10px;
      border:none;
      border-radius:25px;
      padding-left:15px;
      outline:none;
      font-family:Poppins;
    }

    .btn{
      width:120px;
      height:40px;
      border:none;
      border-radius:20px;
      margin-top:15px;
      cursor:pointer;
      font-family:Poppins;
    }

    .login{
      background:#5b2828;
      color: white;
    }

    .cancel{
      background:white;
      color:black;
      margin-left:10px;
    }

    .check{
      margin-top:10px;
      text-align:left;
      margin-left:35px;
      font-size:14px;
    }

  </style>
</head>

<body>

  <div class="box">

    <h1>Login</h1>

    <input type="text" id="username" placeholder="Username">
    <br>

    <input type="password" id="password" placeholder="Password">

    <div class="check">
      <input type="checkbox" id="stayLogged">
      Stay logged in
    </div>

    <button class="btn login" onclick="login()">Login</button>
    <button class="btn cancel" onclick="cancel()">Cancel</button>

  </div>

<script>

  function login(){

    var user = document.getElementById("username").value;
    var pass = document.getElementById("password").value;
    var stay = document.getElementById("stayLogged").checked;

    if(user == "mrbeast67" && pass == "9Ruby"){

      if(stay == true){
        alert("Welcome mrbeast67! (Stay logged in ON)");
      }
      else{
        alert("Welcome mrbeast67!");
      }
    }

    else{
      alert("Incorrect username and/or password.");
    }

  }

  function cancel(){
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    document.getElementById("stayLogged").checked = false;
  }

</script>

</body>
</html>
